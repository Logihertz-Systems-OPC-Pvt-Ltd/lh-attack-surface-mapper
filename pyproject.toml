[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-attack-surface-mapper"
version = "0.1.0"
description = "Maps external network assets, nmap/masscan port inventories, subdomain enumerations, and edge service exposures to identify shadow IT, unencrypted management ports, and high-risk internet-facing services."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "attack-surface",
    "easm",
    "port-scanner-audit",
    "shadow-it",
    "reconnaissance-defense",
    "sarif",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-attack-surface-mapper"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-attack-surface-mapper"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-attack-surface-mapper#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-attack-surface-mapper/issues"

[project.scripts]
lh-asm = "lh_attack_surface_mapper.cli:app"
lh-attack-surface-mapper = "lh_attack_surface_mapper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_attack_surface_mapper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

